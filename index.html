<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Supplies Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Student Supplies Ordering System</h1>

    <div class="layout">
        <section id="product-section">
            <h2>Product List</h2>
            <div id="product-list"></div>
        </section>

        <section id="cart-section">
            <h2>Shopping Cart</h2>
            <div id="cart"></div>
        </section>

        <section id="summary-section">
            <h2>Order Summary</h2>
            <div id="summary"></div>
        </section>

        <section id="payment-section">
            <h2>Payment</h2>
            <div id="payment">
                <label for="amount-paid">Amount Paid (₱):</label><br>
                <input type="text" id="amount-paid" inputmode="decimal" placeholder="Enter cash amount">
                <button onclick="confirmPayment()" id="confirm-btn">Confirm Payment</button>
                <p id="payment-error" class="error"></p>
            </div>
        </section>

        <section id="receipt-section">
            <h2>Receipt</h2>
            <div id="receipt"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
